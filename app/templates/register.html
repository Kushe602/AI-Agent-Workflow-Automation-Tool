{% extends "base.html" %}
{% block title %}Sign up — AgentFlow{% endblock %}
{% block nav %}
  <a href="/login" class="text-slate-600 hover:text-slate-900">Log in</a>
{% endblock %}
{% block content %}
  <div class="mx-auto max-w-sm">
    <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
    {% if error %}
      <p class="mt-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    {% endif %}
    <form method="post" action="/register" class="mt-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700" for="email">Email</label>
        <input id="email" name="email" type="email" required value="{{ email or '' }}"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700" for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none" />
        <p class="mt-1 text-xs text-slate-500">At least 8 characters.</p>
      </div>
      <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700">
        Sign up
      </button>
    </form>
    <p class="mt-4 text-sm text-slate-600">
      Already have an account? <a href="/login" class="font-medium text-indigo-600 hover:underline">Log in</a>.
    </p>
  </div>
{% endblock %}
